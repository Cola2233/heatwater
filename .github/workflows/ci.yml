name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test website/tests/core.test.cjs website/tests/dataset.test.cjs
      - run: node --check website/app.js
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: Installed package and CLI smoke test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import heatwater; print(heatwater.__version__)"
          heatwater --help
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts
      - run: git diff --check
  geospatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gdal python3-numpy python3-matplotlib fonts-noto-cjk
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: /usr/bin/python3 -m scripts.synthetic_case --directory demo
      - run: /usr/bin/python3 -m scripts.run_pipeline --config demo/config.json
      - run: /usr/bin/python3 -m scripts.validate_outputs --config demo/config.json
      - run: /usr/bin/python3 -m scripts.export_web_data --config demo/config.json
